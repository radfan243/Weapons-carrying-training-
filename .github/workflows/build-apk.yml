name: Build Training APK

on:
  push:
    branches: [main, feature/safe-training-app]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.35.2"
          channel: stable
          cache: true
      - name: Create Android scaffold
        run: flutter create . --platforms=android --project-name=weapons_carrying_training
      - name: Analyze
        run: flutter analyze
      - name: Build release APK
        run: flutter build apk --release
      - uses: actions/upload-artifact@v4
        with:
          name: weapons-carrying-training-release
          path: build/app/outputs/flutter-apk/app-release.apk
